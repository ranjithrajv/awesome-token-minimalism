---
name: check_readme_links
description: Validate awesome-list annotations and check external links
on: [push, pull_request]
permissions:
  contents: read
jobs:
  annotate:
    name: Annotation format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check evidence grades and internal anchors
        run: |
          python .github/scripts/check_annotations.py README.md
          python .github/scripts/check_annotations.py --anchors-only GLOSSARY.md
          python .github/scripts/check_annotations.py RESOURCES.md
          python .github/scripts/check_annotations.py TOKENMAXXING.md
          # The two catalogs split out of the README: receipts and cross-links,
          # but no `- **[` entries, so anchors only — same mode as GLOSSARY.md.
          python .github/scripts/check_annotations.py --anchors-only ANTI-PATTERNS.md
          python .github/scripts/check_annotations.py --anchors-only OPEN-PROBLEMS.md
          # Maintainer submissions: grades are enforced once entries exist, but
          # an empty showcase is the current state, not a failure.
          python .github/scripts/check_annotations.py --allow-empty SHOWCASE.md
          # The machine-readable index gets the same anchor and relative-link
          # treatment: it is the first file an agent reads. Its links without a
          # fragment used to be invisible to every check, which is how
          # llms.txt shipped pointing at a doc that did not exist.
          python .github/scripts/check_annotations.py --anchors-only llms.txt
          # The posts index: the result writeups, linked from the README and
          # llms.txt. Anchors only -- it is an index, not a graded list -- but
          # its relative links to the writeups still have to resolve.
          python .github/scripts/check_annotations.py --anchors-only posts/README.md
          # The date gate. Undated entries are one aggregated file annotation,
          # not one per entry; the weekly date-rot sweep carries the full list.
          # It warns rather than fails until entry coverage justifies enforcing.
          python .github/scripts/check_stamps.py README.md RESOURCES.md TOKENMAXXING.md

  links:
    name: Link health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect links
        run: |
          python .github/scripts/check_annotations.py --urls README.md > /tmp/urls.txt
          python .github/scripts/check_annotations.py --urls RESOURCES.md >> /tmp/urls.txt
          python .github/scripts/check_annotations.py --urls TOKENMAXXING.md >> /tmp/urls.txt
          # The two catalogs carry the receipts that used to sit in the README.
          python .github/scripts/check_annotations.py --urls ANTI-PATTERNS.md >> /tmp/urls.txt
          python .github/scripts/check_annotations.py --urls OPEN-PROBLEMS.md >> /tmp/urls.txt
          python .github/scripts/check_annotations.py --urls SHOWCASE.md >> /tmp/urls.txt
          python .github/scripts/check_annotations.py --urls llms.txt >> /tmp/urls.txt
          # The result writeups, linked from the posts index. Low-traffic, but
          # the same one-home-for-link-rot rule applies.
          python .github/scripts/check_annotations.py --urls posts/README.md >> /tmp/urls.txt
          python .github/scripts/check_annotations.py --urls posts/the-seven-word-baseline.md >> /tmp/urls.txt
          python .github/scripts/check_annotations.py --urls posts/harness-results.md >> /tmp/urls.txt
          python .github/scripts/check_annotations.py --urls posts/agent-memory-ab.md >> /tmp/urls.txt
          echo "$(wc -l < /tmp/urls.txt) links collected"
      - name: Check external links resolve
        run: |
          cat /tmp/urls.txt | xargs -P 8 -I{} sh -c '
            code=$(curl -sSL -o /dev/null -w "%{http_code}" \
              --max-time 20 --retry 2 -A "Mozilla/5.0 (compatible; awesome-link-check)" "{}" || echo 000)
            echo "$code {}"
          ' > /tmp/status.txt
          echo "--- results ---"
          cat /tmp/status.txt
          echo "--- failures (excluding known-soft hosts) ---"
          # The soft-host list is a data file, not grep literals buried in CI:
          # the excuses should be reviewable in a diff.
          grep -vE '^(2[0-9][0-9]|3[0-9][0-9]) ' /tmp/status.txt \
            | grep -vEf .github/scripts/link-exceptions.txt \
            || true
          # Non-2xx is reported above but does not fail the job: many hosts
          # (X, PyPI, vendor blogs) reject automated clients while serving
          # humans fine. Fail only on grossly malformed URLs.
          if grep -qE '^(000) https?://[^ ]*$' /tmp/status.txt; then
            echo "::warning::some links were unreachable from CI"
          fi

  grade-index:
    name: Entry index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Entry index matches the README
        # `entries.jsonl` is generated, not edited. A hand-edited index that
        # disagrees with the list is worse than no index, so the gate is a
        # regenerate-and-diff rather than a request in CONTRIBUTING.md.
        run: python .github/scripts/build_entries.py --check

  test:
    name: Harness tests and lint
    runs-on: ubuntu-latest
    strategy:
      # This matrix used to live in harness/.github/workflows/ci.yml, which
      # GitHub never runs: workflows are only read from the repository root.
      # Folded in here so the Python-version coverage is real rather than inert.
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the harness with its dev extras
        run: pip install -e "./harness[dev]"
      - name: Run harness unit tests
        # Covers three modules: the paired A/B statistics, the profiler, and the
        # annotation checks -- including the GitHub slug rules that every emoji
        # anchor in the README depends on.
        run: python -m pytest harness/tests -q
      - name: Lint
        run: ruff check harness/src harness/tasks harness/tests .github/scripts
      - name: CLI smoke test
        # The entry point installs and parses, with no provider key required.
        run: token-harness --help

  tokens:
    name: List token budget
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned tokenizer
        # No `continue-on-error`: the meter has no fallback, so a missing
        # tokenizer should fail here rather than silently change the unit.
        run: pip install -r requirements.txt
      - name: Meter the list's own prose
        run: python .github/scripts/count_tokens.py --fail-over
      - name: Publish token badge (main only)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if git diff --quiet -- .github/badges/tokens.json; then
            echo "badge unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/tokens.json
          git commit -m "chore: update list token badge [skip ci]"
          git push
