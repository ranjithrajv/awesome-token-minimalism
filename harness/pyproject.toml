[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "token-harness"
version = "0.1.0"
description = "Paired A/B measurement harness for token-saving tools. Emits n, p-value, and quality guard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC0-1.0" }
dependencies = [
    "anthropic>=0.40",
    "numpy>=1.26",
    "scipy>=1.11",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
token-harness = "token_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/token_harness", "tasks"]

[tool.ruff]
line-length = 100
target-version = "py310"
