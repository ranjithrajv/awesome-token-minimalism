name: Copilot CLI CI

on:
  workflow_dispatch:
  schedule:
    # Run every 6 hours to create a public audit trail
    - cron: "0 */6 * * *"

jobs:
  copilot-cli-measurement:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check Copilot CLI availability
        id: check
        run: |
          if command -v copilot &> /dev/null; then
            echo "available=true" >> $GITHUB_OUTPUT
            copilot --version >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Run harness with Copilot CLI
        if: steps.check.outputs.available == 'true'
        run: |
          token-harness run \
            --tasks tasks/swebench_lite.json \
            --config configs/copilot-cli.json \
            --output copilot-report.json

      - name: Upload report
        if: steps.check.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: copilot-cli-report
          path: copilot-report.json
          retention-days: 90

      - name: Comment PR with results
        if: steps.check.outputs.available == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('copilot-report.json', 'utf8'));
            const summary = `## Copilot CLI Measurement

            | Metric | Baseline | Treatment | Δ |
            |---|---|---|---|
            | tokens_in | ${report.paired.tokens_in.baseline_mean.toFixed(0)} | ${report.paired.tokens_in.treatment_mean.toFixed(0)} | ${report.paired.tokens_in.mean_diff.toFixed(0)} |
            | cost_usd | $${report.paired.cost_usd.baseline_mean.toFixed(4)} | $${report.paired.cost_usd.treatment_mean.toFixed(4)} | $${report.paired.cost_usd.mean_diff.toFixed(4)} |
            | wall_clock_s | ${report.paired.wall_clock_s.baseline_mean.toFixed(2)} | ${report.paired.wall_clock_s.treatment_mean.toFixed(2)} | ${report.paired.wall_clock_s.mean_diff.toFixed(2)} |

            p-value (tokens_in): ${report.paired.tokens_in.p_value.toFixed(4)}
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
