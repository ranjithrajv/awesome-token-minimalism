name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Test with pytest
        run: pytest tests/ -v --tb=short

      - name: Verify CLI
        run: |
          token-harness run --tasks tasks/example.json --config configs/example.json --output /tmp/report.json
          token-harness report --input /tmp/report.json

  # Optional: run with Copilot CLI if available
  copilot-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check Copilot CLI availability
        id: check
        run: |
          if command -v copilot &> /dev/null; then
            echo "available=true" >> $GITHUB_OUTPUT
            copilot --version >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Run harness with Copilot CLI
        if: steps.check.outputs.available == 'true'
        run: |
          token-harness run --tasks tasks/swebench_lite.json --config configs/copilot-cli.json --output /tmp/copilot-report.json
          token-harness report --input /tmp/copilot-report.json

  # Free-tier smoke test with Groq (replacement for retired GitHub Models)
  groq-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run harness with Groq (free tier)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          token-harness run --tasks tasks/swebench_lite.json --config configs/groq.json --output /tmp/groq-report.json
          token-harness report --input /tmp/groq-report.json
